name: README Quickstart Clean-Room Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  readme-quickstart-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify repository trust files exist
        run: |
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f README.md

      - name: Run documented README 5-minute quickstart commands
        run: |
          set -e
          python3 apps/000-stir-iescs-protocol-sdk/verify_app.py
          for script in apps/*/verify_app.py; do
            echo "=== Smoke check: $script ==="
            python3 "$script"
          done
